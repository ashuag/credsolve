name: moneyCash

# Per-app install logic lives in `docker/entrypoint-dev.sh`. It uses a
# lockfile-signature stamp + filesystem mutex so concurrent containers
# don't trample each other's `npm ci`. See that script for details.
x-node-defaults: &node-defaults
  image: node:22-bookworm-slim
  restart: "no"
  init: true
  # Invoked via `sh` so the script doesn't need the executable bit
  # set on disk (git tracks it as 0644 across clones).
  entrypoint: ["sh", "/usr/local/bin/entrypoint-dev.sh"]
  networks:
    - shared-net

x-entrypoint-mount: &entrypoint-mount
  type: bind
  source: ./docker/entrypoint-dev.sh
  target: /usr/local/bin/entrypoint-dev.sh
  read_only: true

services:
  backend:
    <<: *node-defaults
    tty: true
    env_file: ./backend/.env
    # Nest must listen on all interfaces so other containers (customer, los) can reach `backend:4001`.
    environment:
      HOST: "0.0.0.0"
    ports:
      - "4001:4001"
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend:cached
      - *entrypoint-mount
    # The entrypoint handles `npm ci` + `prisma generate`. We only need
    # the runtime command here: deploy migrations, then start Nest in
    # watch mode.
    command:
      - sh
      - -c
      - npm run prisma:migrate:deploy && npm run dev

  los:
    <<: *node-defaults
    env_file: ./los/.env
    environment:
      API_SERVER_URL: http://backend:4001/api/los
    depends_on:
      - backend
    ports:
      - "3020:3010"
    working_dir: /workspace/los
    volumes:
      - ./los:/workspace/los:cached
      - *entrypoint-mount
    command: ["npm", "run", "dev"]

  customer:
    <<: *node-defaults
    env_file: ./customer/.env
    # Inside the container, localhost is not the API — Next rewrites must target the `backend` service.
    environment:
      API_SERVER_URL: http://backend:4001/api
    depends_on:
      - backend
    ports:
      - "3021:3011"
    working_dir: /workspace/customer
    volumes:
      - ./customer:/workspace/customer:cached
      - *entrypoint-mount
    command: ["npm", "run", "dev"]

networks:
  shared-net:
    external: true
    name: shared-net
