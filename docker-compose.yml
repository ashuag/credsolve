name: moneyCash

x-node-defaults: &node-defaults
  image: node:22-bookworm-slim
  restart: "no"
  init: true
  tty: true
  networks:
    - shared-net

services:
  backend:
    <<: *node-defaults
    env_file: ./backend/.env
    ports:
      - "4001:4001"
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend:cached
    command: >
      sh -c "
        if [ -f package-lock.json ] && [ ! -d node_modules ]; then npm ci;
        elif [ ! -d node_modules ]; then npm install;
        fi &&
        npm run prisma:generate &&
        npm run prisma:migrate:deploy &&
        npm run dev
      "
  los:
    <<: *node-defaults
    env_file: ./los/.env
    ports:
      - "3020:3010"
    working_dir: /workspace/los
    volumes:
      - ./los:/workspace/los:cached
    command: >
      sh -c "
        if [ -f package-lock.json ] && [ ! -d node_modules ]; then npm ci;
        elif [ ! -d node_modules ]; then npm install;
        fi &&
        npm run dev
      "
  customer:
    <<: *node-defaults
    env_file: ./customer/.env
    ports:
      - "3021:3011"
    working_dir: /workspace/customer
    volumes:
      - ./customer:/workspace/customer:cached
    command: >
      sh -c "
        if [ -f package-lock.json ] && [ ! -d node_modules ]; then npm ci;
        elif [ ! -d node_modules ]; then npm install;
        fi &&
        npm run dev
      "

networks:
  shared-net:
    external: true
    name: shared-net