name: moneyCash

# Per-app install logic lives in `docker/entrypoint-dev.sh`. It uses a
# lockfile-signature stamp + filesystem mutex so concurrent containers
# don't trample each other's `npm ci`. See that script for details.
x-node-defaults: &node-defaults
  image: node:22-bookworm-slim
  restart: "no"
  init: true
  # Invoked via `sh` so the script doesn't need the executable bit
  # set on disk (git tracks it as 0644 across clones).
  entrypoint: ["sh", "/usr/local/bin/entrypoint-dev.sh"]
  networks:
    - shared-net

x-entrypoint-mount: &entrypoint-mount
  type: bind
  source: ./docker/entrypoint-dev.sh
  target: /usr/local/bin/entrypoint-dev.sh
  read_only: true

services:
  backend:
    <<: *node-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: moneycash-backend-dev:local
    tty: true
    env_file: ./backend/.env
    # @tensorflow/tfjs-node only ships linux-x64 bindings. Force amd64 so in-house
    # face-api (KYC selfie + Aadhaar match) works on Apple Silicon Docker (via qemu).
    # After changing platform, recreate and wipe backend/node_modules so addons rebuild.
    platform: linux/amd64
    # Nest must listen on all interfaces so other containers (customer, los) can reach `backend:4001`.
    environment:
      HOST: "0.0.0.0"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      # AWS credentials come from backend/.env via env_file. Do not set AWS_ACCESS_KEY_ID here —
      # docker-compose ${VAR:-} interpolation uses the host shell and would override .env with empty strings.
    ports:
      - "4001:4001"
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend:cached
      - *entrypoint-mount
    # The entrypoint handles `npm ci` + `prisma generate`. We only need
    # the runtime command here: deploy migrations, then start Nest in
    # watch mode.
    command:
      - sh
      - -c
      - npm run prisma:migrate:deploy && npm run dev

  los:
    <<: *node-defaults
    env_file: ./los/.env
    # Browser uses same-origin `/api/los` (Next proxy). Inside the container, localhost
    # is not the API — proxy target must be the `backend` service.
    environment:
      NEXT_PUBLIC_API_URL: /api/los
      API_SERVER_URL: http://backend:4001/api/los
    depends_on:
      - backend
    ports:
      - "3020:3010"
    working_dir: /workspace/los
    volumes:
      - ./los:/workspace/los:cached
      # Keep .next off the bind mount — Next's atomic manifest writes race on
      # host-mounted volumes and produce ENOENT on `_buildManifest.js.tmp.*`.
      - los-next:/workspace/los/.next
      - *entrypoint-mount
    command: ["npm", "run", "dev"]

  customer:
    <<: *node-defaults
    env_file: ./customer/.env
    # Inside the container, localhost is not the API — Next rewrites must target the `backend` service.
    environment:
      API_SERVER_URL: http://backend:4001/api
    depends_on:
      - backend
    ports:
      - "3021:3011"
    working_dir: /workspace/customer
    volumes:
      - ./customer:/workspace/customer:cached
      # Keep .next off the bind mount — Next's atomic manifest writes race on
      # host-mounted volumes and produce ENOENT on `_buildManifest.js.tmp.*`.
      - customer-next:/workspace/customer/.next
      - *entrypoint-mount
    command: ["npm", "run", "dev"]

volumes:
  customer-next:
  los-next:

networks:
  shared-net:
    external: true
    name: shared-net
